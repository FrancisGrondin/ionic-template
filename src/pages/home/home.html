<ion-header>
  <ion-navbar>
    <button ion-button menuToggle>
      <ion-icon name="menu"></ion-icon>
    </button>
    <ion-title>{{ 'pages.home.title' | translate }}</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>

  <ion-row>
    <ion-col col-1 offset-11>
      <button ion-button large class='language-button' (click)="switchLanguage()">{{ otherLanguage }}</button>
    </ion-col>
  </ion-row>

</ion-content>
